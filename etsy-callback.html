<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Etsy authorization code</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:0 16px}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:6px;margin:8px 0}</style></head>
<body><h1>Lindenbyte: Etsy authorization</h1><div id="o">Waiting for Etsy&hellip;</div>
<script>
var p=new URLSearchParams(location.search),o=document.getElementById("o");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
if(p.get("error")){o.innerHTML="<p>Etsy returned an error: <b>"+esc(p.get("error"))+"</b> "+esc(p.get("error_description")||"")+"</p>"}
else if(p.get("code")){o.innerHTML="<p>Copy this code and send it to Lindenbyte (Telegram):</p><code>"+esc(p.get("code"))+"</code><p>State:</p><code>"+esc(p.get("state")||"")+"</code><p>It is single-use and expires in minutes.</p>"}
else{o.textContent="No code in the URL. Start again from the link you were sent."}
</script></body></html>
