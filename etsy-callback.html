<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Lindenbyte: Etsy connection</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;color:#1d2a24}
code{display:block;word-break:break-all;background:#eef4f0;padding:.8rem;border-radius:6px;font-size:15px}
button{margin-top:.6rem;padding:.5rem 1rem;border:0;border-radius:6px;background:#2f6b4f;color:#fff;cursor:pointer}</style></head>
<body><h1>Etsy connection</h1>
<p id="msg">Etsy approved the connection. Copy the code below and send it to Lindenbyte (Telegram). It only works together
with a secret kept on our own machine and expires in a few minutes.</p>
<code id="code"></code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
<p><small>This page only displays the code from the address bar; it sends nothing anywhere.</small></p>
<script>
var q=new URLSearchParams(location.search),c=q.get('code'),s=q.get('state'),e=q.get('error');
if(e){document.getElementById('msg').textContent='Etsy returned an error: '+e+' '+(q.get('error_description')||'');}
document.getElementById('code').textContent=c?(c+' '+(s||'')):'(no code in the address bar)';
</script></body></html>
